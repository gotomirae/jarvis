# JARVIS 배치 (PRD §14). cron 은 UTC (KST = UTC+9).
# 정시 시작 = Supabase pg_cron → workflow_dispatch (supabase/migrations/0002·0004, D7).
# 아래 schedule 은 pg_cron 실패·GitHub 지연 대비 30분 뒤 예비다. 슬롯 이름이 pg_cron 과 같아서
# 이미 성공한 슬롯이면 잡이 즉시 끝난다(불변 규칙 13). 공개 저장소 → 로그에 키·개인 금액 출력 금지.
name: jobs

on:
  schedule:
    - cron: "40 22 * * *"     # 07:40 KST 예비: holdings_sync am
    - cron: "40 7 * * *"      # 16:40 KST 예비: holdings_sync pm
    - cron: "30 18 * * 6"     # 일 03:30 KST 예비: taxonomy_sync → entities_sync
    - cron: "0 19 * * *"      # 04:00 KST 예비: link_smoke
    - cron: "30 19 * * 2,6"   # 일·수 04:30 KST 예비: industry_outlook_collect (M3 ②)
    - cron: "30 22 * * *"     # 07:30 KST 예비: industry_growth_realized am
    - cron: "30 10 * * *"     # 19:30 KST 예비: industry_growth_realized pm
    - cron: "42 22 * * *"     # 07:42 KST 예비: pipeline am
    - cron: "40 10 * * *"     # 19:40 KST 예비: pipeline pm
    - cron: "50 22 * * *"     # 07:50 KST 예비: 아침 브리핑 (이미 보냈으면 건너뜀)
    - cron: "45 10 * * *"     # 19:45 KST 예비: 저녁 브리핑
    - cron: "30 11 * * *"     # 20:30 KST 예비: outcomes_update (성과 원장, D47)
  workflow_dispatch:
    inputs:
      job:
        description: "job name (scripts/run.ts)"
        required: true
        default: "outlook_smoke"
      args:
        description: "extra args, e.g. --slot 2026-09-28-am"
        required: false
        default: ""

concurrency:
  group: jarvis-jobs-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  JARVIS_URL: ${{ vars.JARVIS_URL || secrets.JARVIS_URL }}
  ALLOWED_EMAIL: ${{ secrets.ALLOWED_EMAIL }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
  NOTION_IDEA_DB_ID: ${{ secrets.NOTION_IDEA_DB_ID }}
  NOTION_WEEKLY_PARENT_PAGE_ID: ${{ secrets.NOTION_WEEKLY_PARENT_PAGE_ID }}
  GITHUB_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  HEIMDALLR_SUPABASE_URL: ${{ secrets.HEIMDALLR_SUPABASE_URL }}
  HEIMDALLR_ANON_KEY: ${{ secrets.HEIMDALLR_ANON_KEY }}
  HERMES_SUPABASE_URL: ${{ secrets.HERMES_SUPABASE_URL }}
  HERMES_ANON_KEY: ${{ secrets.HERMES_ANON_KEY }}
  SAGE_SUPABASE_URL: ${{ secrets.SAGE_SUPABASE_URL }}
  SAGE_READ_KEY: ${{ secrets.SAGE_READ_KEY }}
  SNOWBALL_SUPABASE_URL: ${{ secrets.SNOWBALL_SUPABASE_URL }}
  SNOWBALL_ANON_KEY: ${{ secrets.SNOWBALL_ANON_KEY }}
  SNOWBALL_JARVIS_TOKEN: ${{ secrets.SNOWBALL_JARVIS_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90          # M3 ② 수집이 가장 길다(18개 L1 + 증권사 sitemap)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: manual / pg_cron dispatch
        if: github.event_name == 'workflow_dispatch'
        run: npm run job -- ${{ inputs.job }} ${{ inputs.args }}

      # ---- 예비 스케줄 (슬롯 = pg_cron 과 동일한 KST 날짜 규칙) ----
      - name: holdings_sync am (예비)
        if: github.event.schedule == '40 22 * * *'
        run: npm run job -- holdings_sync --slot "$(TZ=Asia/Seoul date +%F)-am"
      - name: holdings_sync pm (예비)
        if: github.event.schedule == '40 7 * * *'
        run: npm run job -- holdings_sync --slot "$(TZ=Asia/Seoul date +%F)-pm"
      - name: taxonomy_sync → entities_sync (예비)
        if: github.event.schedule == '30 18 * * 6'
        run: |
          npm run job -- taxonomy_sync --slot "$(TZ=Asia/Seoul date +%F)-weekly"
          npm run job -- entities_sync --slot "$(TZ=Asia/Seoul date +%F)-weekly"
      - name: link_smoke (예비)
        if: github.event.schedule == '0 19 * * *'
        run: npm run job -- link_smoke --slot "$(TZ=Asia/Seoul date +%F)-daily"
      - name: industry_outlook_collect (예비)
        if: github.event.schedule == '30 19 * * 2,6'
        run: npm run job -- industry_outlook_collect --slot "$(TZ=Asia/Seoul date +%F)-outlook"
      - name: industry_growth_realized (예비)
        if: github.event.schedule == '30 22 * * *' || github.event.schedule == '30 10 * * *'
        run: npm run job -- industry_growth_realized --slot "$(TZ=Asia/Seoul date +%F)-$([ "$(TZ=Asia/Seoul date +%H)" -lt 12 ] && echo am || echo pm)"
      - name: pipeline (예비)
        if: github.event.schedule == '42 22 * * *' || github.event.schedule == '40 10 * * *'
        run: npm run job -- pipeline --slot "$(TZ=Asia/Seoul date +%F)-$([ "$(TZ=Asia/Seoul date +%H)" -lt 12 ] && echo am || echo pm)"
      - name: 아침 브리핑 (예비)
        if: github.event.schedule == '50 22 * * *'
        run: npm run job -- brief --kind morning --slot "$(TZ=Asia/Seoul date +%F)"
      - name: 저녁 브리핑 (예비)
        if: github.event.schedule == '45 10 * * *'
        run: npm run job -- brief --kind evening --slot "$(TZ=Asia/Seoul date -d '12 hours ago' +%F)"   # 자정 넘어 지연 실행돼도 그날 저녁분(D48)
      - name: outcomes_update (예비)
        if: github.event.schedule == '30 11 * * *'
        run: npm run job -- outcomes_update --slot "$(TZ=Asia/Seoul date +%F)-daily"

      - name: smoke 결과 보관 (상태·개수·호스트만, 값·키 없음)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-out-${{ github.run_id }}
          path: smoke-out/
          if-no-files-found: ignore
          retention-days: 14
