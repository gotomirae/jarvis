# 외부 링크 규칙 — 텔레그램·대시보드 공용 단일 출처 (PRD §9.4)
# lib/links.ts 가 이 파일만 읽는다. 링크를 만들 수 없으면 버튼을 생략한다(죽은 링크·빈 화면 금지).
# 실측 근거: Heimdallr src/notify/links.py, HermesCall src/notify/stock_links.py (2026-09-02~22 확인)

dashboards:                         # 메시지 하단 공통 버튼 (홈)
  jarvis:     {label: "📊 JARVIS",     url: "${JARVIS_URL}/"}
  heimdallr:  {label: "🛡️ Heimdallr",  url: "https://heimdallr-call.vercel.app/"}
  hermescall: {label: "⚡ HermesCall", url: "https://hermes-call-psi.vercel.app/"}
  snowball:   {label: "❄️ SnowBall",   url: "https://snowball-heritage.vercel.app/ironman/portfolio"}
  sage:       {label: "🧙 Sage",       url: "https://sage-gotomiraes-projects.vercel.app/"}      # Vercel 로그인 보호(본인 사용 OK)
  flywheel:   {label: "🔄 FlyWheel",   url: "https://www.notion.so/36a9c770aa61809c95e5c1117f9779b5"}   # 웹 대시보드 없음 → 노션 2_1. 산업 & 종목

stock:                              # 종목별 버튼. {code}=국내 6자리, {symbol}=미국 티커, {naver_us}=NVDA.O 등
  jarvis:
    label: "📊 JARVIS"
    url: "${JARVIS_URL}/stock/{entity_id}"
    markets: [KR, US]
  heimdallr:
    label: "🛡️ Heimdallr"
    url: "https://heimdallr-call.vercel.app/stock/{code}"
    markets: [KR]
  hermescall:
    label: "⚡ HermesCall"
    url: "https://hermes-call-psi.vercel.app/analysis/{hermes_analysis_id}"    # 해당 종목 관련 최신 분석이 있을 때만
    fallback: "https://hermes-call-psi.vercel.app/screener"
    markets: [KR, US]
  snowball:
    label: "❄️ SnowBall"
    url: "https://snowball-heritage.vercel.app/ironman/asset/{snowball_asset_id}"   # SnowBall 자산이 있을 때
    fallback: "https://snowball-heritage.vercel.app/ironman/ideas"
    markets: [KR, US]
  sage:
    label: "🧙 Sage"
    url: "https://sage-gotomiraes-projects.vercel.app/?q={name_urlenc}&date=30d"    # 멘토 글 검색
    markets: [KR, US]
  flywheel:
    label: "🔄 FlyWheel"
    url: "https://www.notion.so/{flywheel_l2_page_id_nodash}"    # 종목 primary L1의 L2 [산업] 페이지 (config/industries.json)
    fallback: "https://www.notion.so/36a9c770aa61809c95e5c1117f9779b5"
    markets: [KR, US]
  naver:
    label: "🟢 네이버증권"
    # Npay 증권 종목 "차트·시세" 탭 (10/3 사용자 지정·실측: PC 는 stock.naver.com …/price = 차트·시세 탭, …/total 은 /price 로 307.
    # 휴대폰에서는 m.stock.naver.com 종목 화면(종합 — 차트·시세 포함)으로 자동 이동)
    kr: "https://stock.naver.com/domestic/stock/{code}/price"
    us: "https://stock.naver.com/worldstock/stock/{naver_us}/price"
    us_resolve_api: "https://api.stock.naver.com/stock/{symbol}{suffix}/basic"   # 200 이고 'StockConflict' 없으면 채택
    us_suffixes: [".O", ".K", ""]                                           # 나스닥 → 뉴욕 → 접미사 없음. P1 실측(9/28): TSM·MDT·IBM 은 접미사 없이만 200(reutersCode "TSM"), DELL 은 .K. 응답의 reutersCode 를 우선 채택
    us_fallback: "https://search.naver.com/search.naver?query={symbol}"     # 미수록 종목(MDT 실측)
    markets: [KR, US]
  stockeasy:
    label: "📈 StockEasy"
    # 메인 → 종목분석 → 종목 선택과 같은 경로(사이트 라우트 stockInfoPath·usStockInfoPath, 10/3 실측). 로그인 전엔 "종목 요약", 로그인 후 종목분석 전체
    kr: "https://stockeasy.intellio.kr/stock-analysis/stock-info/{code}"
    us: "https://stockeasy.intellio.kr/us/stock-info/{symbol}"
    markets: [KR, US]

layout:
  stock_card_rows:                  # 인라인 키보드 (한 행 최대 3개)
    - [jarvis, heimdallr, hermescall]
    - [snowball, sage, flywheel]
    - [naver, stockeasy]
  action_row: ["snowball_idea", "ignore_7d"]
  multi_stock_messages: "inline_text_links"   # 브리핑처럼 종목이 여러 개면 종목명 옆에 <a>네이버</a>·<a>StockEasy</a>·<a>Heimdallr</a> 텍스트 링크, 하단에 dashboards 버튼
  naver_us_code_cache_days: 30

smoke:                              # 링크 스모크 (PRD §9.4, 매일 03:30). 규칙별 대표 URL 1개씩 GET
  samples:                          # 대표 종목 — hermes_analysis_id·snowball_asset_id 는 실행 시 entities 에서 채운다
    KR: {symbol: "000660", name: "SK하이닉스", primary_l1: "1b"}
    US: {symbol: "NVDA", name: "NVIDIA", primary_l1: "1a"}
  login_redirect_ok: [stockeasy, sage, snowball, jarvis]   # 로그인 필요 페이지: 3xx(로그인 이동)·401 을 정상으로 본다 (T13). JARVIS 대시보드도 매직링크 보호
  # 빈 화면 판정은 <title> 안에서만 한다. P1 실측(9/28): Next.js 앱(Heimdallr·HermesCall)과 StockEasy 는 정상 페이지 번들에도
  # "This page could not be found"·"페이지를 찾을 수 없습니다" 문자열이 들어 있어 본문 검사는 오탐. 없는 종목은 HermesCall·StockEasy 가 404 로 응답.
  title_patterns: ["404", "Not Found", "찾을 수 없", "존재하지 않"]
  body_patterns: ["StockConflict", "404: NOT_FOUND"]   # JSON API·Vercel 기본 404 처럼 본문 전체가 오류인 경우
  min_body_bytes: 200
  timeout_sec: 45                   # Heimdallr 홈 첫 로딩 19.5초(1MB) 실측
  max_redirects: 5                  # notion.so/<id> → /p/<id> → app.notion.com 2단계
