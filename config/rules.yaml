# JARVIS 판정 규칙 — 단일 출처 (PRD §6·§7·§12)
# 코드에 임계값 하드코딩 금지. 변경은 PR + docs/DECISIONS.md 기록.
# 보정: 표본 30건 미만 항목은 변경 금지 (PRD §12.4)

version: 4   # 2026-09-27 — M1~M5 필수 + M3 근거 3종 중 하나. v4: M3 ② 무료 검색·정규식 추출·자동 채택(D19)

normalize:
  industry_narrative: {multiplier: 2, ttl_days: 14}            # FlyWheel 신호강도 1~5 → 2~10
  company_mention_fw: {counts: {1: 4, 2: 6, 3: 8}, ttl_days: 14}
  mentor_consensus: {min_sage_score: 50, counts: {2: 6, 3: 8, 4: 10}, ttl_days: 30}
  earnings_catalyst: {ttl_days: 60}
  earnings_quality_us: {per_filter: 2.5, ttl_days: 90}
  industry_sentiment: {ttl_days: 30}
  accel_grade: {"★": 10, "○": 7, "△": 5, "·": 2, base_effect_penalty: 2}

axes:
  N: {industry_narrative_min: 8, company_mention_min: 6, mentor_consensus_min: 6}
  C: {earnings_catalyst_min: 7, us_filters_any: ["F1", "F2"]}
  F: {kr_score_min: 75, kr_gate_required: true, us_filters_all: ["F3", "F4"], turnaround: true}   # turnaround: 실적 증가·가속이 아니어도 영업이익 턴어라운드면 F ON (D68 — 정의는 entry_core.M1 turnaround)
  P: {buy_max: 40, pullback_min: 65, take_profit_min: 75}

regime:
  risk_off_if: {snowball_regime: -1, or_all: {vix_min: 25, kospi_below_ma: 60}}
  risk_off_effects: {weight_multiplier: 0.5, buy_requires: {kr_grade: "★", us_filters_all: ["F1", "F3", "F4"]}}
  phase: {ma_long: 60, ma_short: 20, slope_days: 5, index: {KR: "^KS11", US: "^GSPC"}}   # 시장 국면(상승·하락·횡보장) — 사후 검증을 국면별로 따로 학습(D69)

queues:
  order: ["holding_alert", "take_profit", "buy", "radar", "pullback_wait"]
  holding_alert:
    heimdallr_score_delta_max: -5
    flywheel_unfavorable_level: 3
    mentor_flip_min: 2
    mentor_flip_window_days: 14
    setup_invalidation_window_days: 20
    # P2 실측(9/28): SnowBall risk_alerts 7일 250건(drawdown/warn 215·dynamic_weight/critical 22) → 규칙·심각도 필터 + 종목·규칙별 묶음
    snowball_risk:
      rule_types: {dynamic_weight: ["critical"], drawdown: ["warn", "critical"], thesis_breach: ["warn"]}   # allocation_drift·volume_anomaly(info)는 경고 아님
      # ⚠️ 주가 위치 경고 = 셋 중 하나 (사용자 지정 10/9, D69 — SnowBall 과 같은 규칙): ① 고점 대비 −10% ② 5일선이 10일선 하향 돌파 ③ 5일선이 20일선 하향 돌파
      drawdown_max_pct: -10.0          # ① 고점(52주 종가) 대비 −10% 이하 (옛 −20%, PRD §7.5)
      drawdown_step_pct: 5.0           # 드로다운은 5%p 더 깊어질 때만 다시 알림(−10 → −15 → −20). P2 실측: 2일 창에 후보 48건 → 주 1회 반복은 과다
      price_kinds: {ma5_ma10_dead_cross: "5일선이 10일선 하향 돌파", ma5_ma20_dead_cross: "5일선이 20일선 하향 돌파"}   # ②③ SnowBall thesis_breach payload.kind (그 외 thesis_breach 는 트리거 경로가 맡음)
      dedupe_days: 7                   # 그 외 규칙은 같은 종목·규칙 7일에 1번
    thesis_break_trigger: {thesis_link: "훼손", direction: "negative", alert_on: ["new", "imminent"]}   # 훼손조건 매칭 트리거
  take_profit: {heat_min: 76, pri_min: 75}
  buy: {min_signal_families: 2}
  radar: {next_earnings_within_days: 45}
  pullback_wait: {pri_alert_below: 50}
  snowball_submit: {queues: ["buy", "radar"], max_per_day: 3, dedupe_days: 7}

# ─────────────────────────────────────────────────────────────
# 진입 신호 필수 조건 M1~M5 (PRD §7.3, 사용자 지정 2026-09-27)
# 🟢 진입 신호 = M1 ∧ M2 ∧ M3 ∧ M4 ∧ M5 (+ entry_gate). 하나라도 빠지면 🟢 불가.
# 계산 위치: 국내 M1·M2·M5 = Heimdallr / 미국 M1·M2·M5 = HermesCall / M3·M4·게이트 = JARVIS
# ─────────────────────────────────────────────────────────────
entry_core:
  M1_earnings_up_price_not:          # (실적 지속 증가 + 성장 가속  또는  영업이익 턴어라운드) + 주가 미반영(조정·횡보)
    earnings_pass_if_any: ["growth_accel", "turnaround"]   # 사용자 지정 2026-10-08(D68): 실적 조건 = 아래 quarterly·annual(증가·가속) 또는 turnaround
    turnaround:                                 # 영업이익 턴어라운드(매출 증가) — 🎯 F축(JARVIS)과 🟢 M1(원 프로젝트)이 같은 정의를 쓴다
      op_now_positive: true                     # 최근 확정 분기 영업이익 흑자 (미국은 영업이익이 없으면 주당순이익)
      op_year_ago_max: 0                        # 전년 동기 영업이익 ≤ 0 → 흑자 전환(국내 Heimdallr 라벨 "흑전"). 적자 축소는 아직 적자라 제외
      revenue_yoy_min_pct: 0.0                  # 최근 분기 매출 YoY > 0 (매출 증가)
    quarterly:
      consecutive_quarters_yoy_positive: 2      # 매출·영업이익 YoY 모두 > 0, 최근 2개 분기 연속
      op_must_be_positive: true                 # 영업이익 흑자 (부호 전환 구간 제외)
      acceleration: {revenue_yoy_rising: true, op_yoy_rising: true}   # 최근 분기 YoY > 직전 분기 YoY (둘 다)
      reject_base_effect_warning: true          # Heimdallr base_effect_warning = true 이면 탈락
    annual:
      ttm_revenue_growth_min_pct: 0.0           # TTM 매출·영업이익 > 4분기 전 TTM
      ttm_op_growth_min_pct: 0.0
      use_annual_consensus_if_available: true   # 올해(E) 매출·영업이익 > 전년 확정 (국내 네이버, 미국은 가능 시)
    price_not_reflected:                        # (조정 또는 횡보) 그리고 반영도 낮음
      correction: {from_post_earnings_high_max_pct: -10.0, or_from_52w_high_max_pct: -15.0}
      sideways: {range_20d_max_pct: 12.0, abs_return_20d_max_pct: 5.0}
      reflection_max: {kr_pri: 50, us_pri_lite: 50}
  M2_macd_pre_cross:                 # MACD가 Signal을 아래→위로 상향 돌파하기 직전
    params: [12, 26, 9]
    macd_below_signal: true
    hist_rising_bars_min: 2                     # 히스토그램(음수) 2일 연속 개선
    near_cross_gap_pct_of_close_max: 0.30       # (Signal − MACD) / 종가 ≤ 0.30%
    or_projected_bars_to_cross_max: 3           # 최근 히스토그램 기울기로 추정한 교차까지 봉 수
    allow_cross_today: true                     # 당일 교차는 "크로스 당일"로 표시해 허용
  M3_industry_high_growth:           # 해당 산업(L1)이 높은 성장 중 — 근거 3종 중 하나 이상 (사용자 지정 2026-09-27)
    pass_if_any: ["realized", "us_major_broker", "outlook"]
    required_bases: []                          # 특정 근거를 필수로 하려면 여기에 추가 (예: ["us_major_broker"])
    realized:                                   # ① 실제 실적
      median_revenue_yoy_min_pct: 15.0
      consecutive_quarters: 2
      median_op_yoy_min_pct: 0.0
      min_members: 5                            # 부족하면 국내+미국 합산, 그래도 부족하면 '판단 불가'
    us_major_broker:                            # ② 미국 메이저 증권사 산업 성장률 전망 (무료 공개 검색, 로그인·유료 자료 사용 안 함) — D19
      growth_min_pct: 15.0                      # L1별 '증권사별 최신 채택값'의 중앙값 기준
      aggregate: "median_of_latest_per_broker"
      metrics: ["CAGR", "CAGR_DERIVED", "NEXT_YEAR"]
      horizon_end_max_years_ahead: 5            # CAGR 종료 연도 ≤ 올해 + 5
      max_published_age_days: 90                # 최근 3개월 이내 발표
      brokers_list: "config/industry_growth.yaml#us_major_brokers"
      source: "free_news_search"                # config/industry_growth.yaml#news_search (LLM·유료 API 금지)
      extraction: "deterministic_regex"         # quote = 원문 문장 그대로
      require_status: "adopted"                 # 자동 채택 규칙 통과분만 사용 (사람 확인 없음)
      adoption:                                 # 하나라도 만족하면 adopted, 아니면 unverified(표시만)
        A1_tier_a_single: true                  # 증권사 자체 도메인 단독
        B1_tier_b_min_independent_sources: 2    # 서로 다른 주요 매체 2곳 이상, 같은 증권사·L1
        B1_value_tolerance_pctp: 2.0
        B1_syndication_similarity: 0.9          # 문장 유사도 ≥ 0.9 는 같은 기사로 간주
        B2_tier_b_single_requires: ["broker_name", "cagr_word", "year_range"]
        conflict_threshold_pctp: 5.0            # 같은 증권사·L1 값 차이 ≥ 5%p → 최신값 사용 + conflict 표시
        date_mismatch_max_days: 3               # 목록 날짜 vs 본문 메타 차이 초과 시 더 이른 날짜
        tier_b_requires_meta_date: true
    outlook:                                    # ③ config/industry_growth.yaml 성장 전망(시장조사기관·IR 등)
      config: "config/industry_growth.yaml"
      cagr_3y_min_pct: 15.0
      max_age_months: 12
  M4_catalyst_within_6m:             # 산업 또는 기업의 주가 상승 이벤트가 향후 6개월 내
    horizon_days: 180
    min_events: 1
    require_date_or_window_end: true
    require_source: true
    sources: ["snowball_triggers", "hermescall_triggers_timeline", "hermescall_catalyst_watch", "heimdallr_analysis_triggers", "earnings_with_rising_consensus", "catalyst_calendar_yaml"]
    earnings_with_rising_consensus: {consensus_change_30d_min_pct: 0.0}   # 다음 실적일 ≤180일 + 30일 추정치 상향(>0%)이면 이벤트로 인정
  M5_flow_2days:                     # 외국인 또는 기관 매수 우위 최소 2일 연속
    kr: {days: 2, pass_if_any: ["foreign_consecutive", "institution_consecutive", "foreign_plus_institution_consecutive"]}
    us_proxy: {days: 2, accumulation_day: {close_up: true, volume_vs_ma20_min: 1.0}}   # 미국은 투자자별 일별 수급 미공개 → 매집일 대용

entry_gate:
  risk_off_weight_multiplier: 0.5
  pri_hard_max: 50
  weight_capacity_required: true     # SnowBall allowed_weight 여유 없으면 🟢 대신 "비중 한도"
  watch_level_if: "M1 and M2 and at_least_2_of[M3,M4,M5]"    # 🟡 관찰 (대시보드·저녁 브리핑 목록, 실시간 없음)
  first_tranche: 0.3333              # 1차 1/3 → 확인 1/3 → 다음 실적 확인 1/3
  invalidation: {PB: "low_10d", SW: "low_20d", CU: "signal_day_low_or_leader_below_event_close", PEAD_PB: "breakout_d0_low"}

tech_display:                        # 🎯 추천 카드의 가격·기술 지표 ⑤~⑧ (표시 전용 — 판정 조건 아님). MACD "직전" 기준은 entry_core.M2_macd_pre_cross 를 그대로 쓴다
  source: "yahoo_chart_1y"             # lib/ingest/market.ts 일봉 종가 (국내 .KS/.KQ, 미국 티커)
  ma: [5, 10]                          # 5일선 · 10일선 (사용자 지정 10/9 D69 — 5·20 → 5·10)
  ma_near_gap_pct_max: 1.0             # 5일선이 10일선 아래 1.0% 이내 …
  ma_narrowing_days_min: 2             # … 이고 격차가 2일 연속 좁혀지면 "상향 통과 직전"
  rsi_period: 14                       # Wilder RSI
  rsi_direction_days: 3                # 방향 = 오늘 vs 3거래일 전
  rsi_flat_band: 1.0                   # ±1.0 이내 변화는 보합
  high_lookback_days: 250              # 고점 대비 하락률 = 최근 250거래일(≈52주) 최고 종가 대비
  base_range_max_pct: 8.0              # 횡보 = 최근 N거래일 종가 폭(최고 ÷ 최저 − 1) ≤ 8% (Heimdallr 조정 후 횡보 10일 폭 8% 와 같은 값, D69)

setup_tags:                          # 🟢 신호의 맥락 표시 (판정 조건 아님, 성과 귀속 단위)
  PB: "눌림 (M1 조정)"
  SW: "횡보 (M1 횡보)"
  CU: "공급망 캐치업 (HermesCall catalyst_watch 해당)"
  PEAD_PB: "실적 돌파 후 눌림 (60거래일 내 🔵 이력)"

breakout_watch:                      # 🔵 실적 돌파 관찰 — 진입 신호 아님. 이후 M1~M5 통과 시 PEAD_PB 태그로 🟢
  K1_kr:
    grades: ["★", "○"]
    gap_open_min_pct: 3.0
    or_close_return_min_pct: 5.0
    volume_mult_min: 2.5
    close_location_min: 0.7
    arm_days: 60
  H1_us:
    require_filters: ["F1", "F2"]
    f1_eps_surprise_min_pct: 3.0
    gap_min_pct: 4.0
    gap_min_pct_megacap: 3.0
    megacap_usd: 200000000000
    volume_mult_min: 2.0
    close_location_min: 0.7
    arm_days: 60

catch_up_candidate:                  # HermesCall → catalyst_watch (태그 CU + M4 이벤트 제공)
  strength_min: 7
  window_trading_days: 10
  leader_ret_min_pct: 6.0
  bene_ratio_max: 0.3333

gate:
  daily_green_max: {KR: 2, US: 1}
  priority: ["signal_families_desc", "pri_asc", "m3_realized_growth_desc", "m4_nearest_event_asc"]
  priority_by_tag_after_calibration: true      # 태그별 표본 30건 이후 성과 순위로 교체
  resend_block_trading_days: 14

pri_us_lite:
  weights: {pos_52w: 0.30, rel_ret_3m_pctile: 0.25, rsi14: 0.20, ma50_gap: 0.15, post_earnings_reaction: 0.10}

inbox:
  max_per_day: 5
  hermescall: {stage: "final", strength_min: 7, or_filters_min: 2}
  heimdallr: {grades: ["★"], stage: 3}
  sage: {new_mentors_min: 2}

outcomes:                            # 성과 원장 (PRD §12, D47) — lib/outcomes · outcomes_update 20:00
  entry_price: "next_trading_day_close"
  horizons_days: [5, 10, 20, 40, 60] # D47: 사용자 지정(D+40 추가) · D69: D+10 추가(기준별 승률 10·20거래일). 거래일 기준
  benchmarks: {KOSPI: "KOSPI", KOSDAQ: "KOSDAQ", US: "SPX"}
  # 시세: 국내 = 네이버 일봉(거래소 공식 종가 — 야후 국내 종가는 동시호가 전 값, D47), 미국 = 야후
  benchmark_symbols: {KOSPI: {source: naver, sym: "KOSPI"}, KOSDAQ: {source: naver, sym: "KOSDAQ"}, SPX: {source: yahoo, sym: "^GSPC"}}
  min_samples_for_calibration: 30

feedback:                            # 성과 피드백 (PRD §7.3 게이트 6 · §12, D49) — lib/engine/feedback.ts · lib/outcomes/attribution.ts · review.ts
  basis: "absolute"                  # 채점 = 추천일 기준 절대 수익률(사용자 지정 10/9, D69). "excess" = 시장 대비 초과수익(D49 옛 기준)
  primary_horizon: 20                # 순위·카드·보정 기준 기간(거래일) — SC5 와 같은 D+20
  report_horizons: [10, 20]          # /verify 기준별 승률 기간 (사용자 지정 10/9 — 10거래일 · 20거래일 뒤)
  min_samples: 30                    # 이 표본 미만 구간은 순위·보정에 쓰지 않음(T12 과최적화 방지)
  shrinkage_k: 30                    # 표본 수 가중 축소: 기대 수익률 = n/(n+k) × 구간 중앙값
  dimensions: [families, sources, p_bucket, grade, market, l1, timing_verdict, timing_check, timing_score, setup_path, market_phase]   # timing_*·setup_path 는 브리핑 후보 원장(pick)에만(D54). setup_path = 주가 위치 A·B, market_phase = 상승·하락·횡보장(D69)
  p_buckets: [20, 30, 40]            # 주가 반영도 구간 <20 · 20~30 · 30~40 · ≥40 (40 = axes.P.buy_max 와 맞춤)
  timing_score_buckets: [1, 4, 6]    # ⏱️ 매수 매력 점수 구간 <1 · 1~4 · 4~6 · ≥6
  review:                            # 분기 보정 제안 — 제안만, 자동 적용 금지(PRD §12)
    min_gap_pctp: 2.0                # 구간 중앙값이 🎯 전체보다 이만큼(%p) 이상 다를 때만 제안

# ─────────────────────────────────────────────────────────────
# ⏱️ 지금 사기 좋은가 (사용자 지정 2026-10-04, D53) — lib/engine/timing.ts
# "좋은 기업"(실적·산업·합의 = 🎯 큐 자격)과 "지금 투자하기 좋은 주식"(가격·추세·수급)을 분리한다.
# 🎯 TOP 추천 선별·순위·표시 전용. 🟢 진입 신호(M1~M5)와 무관(불변 규칙 4). 자료 없는 항목은 0점.
# ─────────────────────────────────────────────────────────────
buy_timing:
  p: {great_max: 25, good_max: 40}                     # 주가 반영도 <25 크게 덜 반영 · <40 덜 반영 · 그 외 이미 반영
  p_weight: 0.5                                        # 주가 반영도 점수 배율 — 보정 중이라 작게(사용자 지정 10/8, 향후 상향 예정)
  setup:                                               # 🎯 필수 조건 (상승 초기에 투자 — 10/8 D65, 10/9 D69 사용자 지정): 아니면 TOP 추천 제외
    require: true                                      #   MACD 시그널 상향 돌파 직전·오늘·직후  그리고  주가 위치 A 또는 B (모든 프로젝트 공통)
    just_after_days: 3                                 #   "바로 직후" = 상향 돌파 후 3거래일 이내 (돌파 당일 = 1일째)
    # A = 5일선이 10일선 상향 돌파 직전·직후(3거래일 이내) + 고점 대비 눌림(position 사이 구간 — 신고가 추격 방지)
    base: {drawdown_min_pct: -20.0, drawdown_max_pct: -10.0, days_min: 10}   # B = 52주 고점 대비 10~20% 조정 후 10거래일 이상 횡보(tech_display.base_range_max_pct)
  position: {chase_above_pct: -5.0, deep_below_pct: -40.0}   # 52주 고점 대비 −5% 위 = 추격 주의, −40% 아래 = 하락 추세 의심, 사이 = 눌림
  rsi: {overheat_min: 70, near_hot_min: 65, rebound_max: 45}   # RSI ≥70 과열(감점) · 65~70 과열 근접(표시만) · ≤45 에서 상승 전환 = 반등 시작
  flow_days: 2                                         # 외국인 또는 기관 N일 연속 순매수 (사용자 지정 매수 근거)
  event_within_days: 90                                # 가까운 상승 이벤트
  points:
    p_great: 2
    p_good: 1
    p_high: -1
    pullback: 1
    chase: -1
    deep: -1
    rsi_hot: -2
    rsi_rebound: 1
    cross: 1                                           # MACD·5일선 상향 돌파 직전·당일·직후 (각각)
    base: 1                                            # 조정 후 횡보 (B)
    trend_down: -1                                     # 아래로 벌어지는 중 (각각)
    flow_buy: 2                                        # 외국인 또는 기관 연속 순매수
    flow_proxy: 1                                      # 미국 매집일 대용(D15)
    flow_sell: -1                                      # 외국인·기관 모두 연속 순매도
    event: 1
    risk_off: -1
  verdict: {high_min: 4, mid_min: 1}                   # ≥4 🔥 매력 높음 · 1~3 ⚖️ 분할 접근 · ≤0 ⏸️ 지금은 대기

# 🎯 TOP 추천 선별 기준 + 사후 검증 피드백 (사용자 지정 2026-10-04, D54) — lib/engine/pick-policy.ts
# 브리핑마다 🎯 후보 전체를 원장(pick)에 남기고 outcomes_update(20:00)가 D+5·20·40·60 을 측정한다.
# 표본 ≥ min_samples 구간 중 승률·초과수익이 낮은 구간은 다음 브리핑부터 TOP 추천에서 자동 제외(auto_apply), 좋은 구간은 순위에 가중(feedback).
pick_policy:
  auto_apply: true
  min_samples: 30
  target_hit_rate: 0.55            # 목표 승률(20거래일 뒤 추천일 기준 절대 수익률 > 0 비율 — D69, feedback.basis)
  min_gap_pctp: 2.0                # 후보 전체보다 이만큼 나쁠(좋을) 때만 제외(우수)로 본다
  base_exclude_verdicts: ["wait"]  # 기본 기준: ⏸️ 지금은 대기 종목은 TOP 추천에 올리지 않음
  scope: "pick_all"                # 학습 표본 = 추천 여부와 무관한 후보 전체(선택 편향 방지)
  top_max: 5                       # 브리핑 TOP 추천 최대 수
  promote_from: ["pullback_wait"]  # ⏳ 눌림 대기 중 상승 초기 조건(buy_timing.setup) 만족 종목은 🎯 후보로 올림 — 주가 반영도 보정 중(사용자 지정 10/8, D66)

# 🦾 포트폴리오 정책 (사용자 지정 2026-10-08) — SnowBall D-71 과 같은 값. 동적 허용 계산은 SnowBall(position-tiers.ts) 몫이고
